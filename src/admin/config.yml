# Sveltia CMS configuration (Decap-compatible schema).
# Collections mirror the content that actually ships — don't add fields the
# templates don't render or folders that don't exist (LAB-473 / LAB-15).
backend:
  name: github
  repo: 27Bslash6/mermaidkaz.com
  branch: main
  # OAuth relay lives on the production Worker (worker/index.js). One relay
  # serves prod, staging and preview admins — the token is postMessaged back
  # to the opener's origin, so base_url stays absolute and production.
  base_url: https://mermaid.fnord.lol
  auth_endpoint: api/auth

# Media management
media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

# Site configuration
site_url: https://mermaid.fnord.lol
display_url: https://mermaid.fnord.lol
logo_url: /assets/images/logo.png

# Collections
collections:
  # Site settings
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "src/_data/site.json"
        fields:
          - { label: "Site Title", name: "title", widget: "string" }
          - { label: "Site Tagline", name: "tagline", widget: "string" }
          - { label: "Site Description", name: "description", widget: "text" }
          - { label: "Site URL", name: "url", widget: "string" }
          - label: "Author"
            name: "author"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
          - label: "Social Media"
            name: "social"
            label_singular: "Social Link"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - {
                  label: "Icon",
                  name: "icon",
                  widget: "select",
                  options: ["instagram", "facebook"],
                }
          - label: "Contact Information"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
          - label: "Booking"
            name: "booking"
            widget: "object"
            fields:
              - {
                  label: "PADI courses booking URL",
                  name: "courses_url",
                  widget: "string",
                }

      - name: "eventbrite"
        label: "Eventbrite Bookings"
        file: "src/_data/eventbrite.json"
        fields:
          - label: "Offerings"
            name: "offerings"
            label_singular: "Offering"
            widget: "list"
            hint: "Paste an offering's Eventbrite event ID to show its booking
              button on the site. Leave the ID empty to hide the button. The
              event must be published on Eventbrite before the checkout can
              load. Don't change the Key — it ties the offering to its spot
              on the page."
            fields:
              - { label: "Key (don't change)", name: "key", widget: "string" }
              - { label: "Button label", name: "label", widget: "string" }
              - {
                  label: "Eventbrite event ID",
                  name: "eventId",
                  widget: "string",
                  required: false,
                  hint: "The number at the end of the event's URL on Eventbrite",
                }
              - {
                  label: "Eventbrite event page URL",
                  name: "eventUrl",
                  widget: "string",
                  required: false,
                  hint: "Optional fallback link; derived from the event ID if empty",
                }

  # Pages
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "src/index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - {
              label: "Layout",
              name: "layout",
              widget: "hidden",
              default: "page",
            }
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Hero Image", name: "image", widget: "image" }
              - {
                  label: "Hero Image Alt Text",
                  name: "imageAlt",
                  widget: "string",
                }
              - label: "Call to Action"
                name: "cta"
                widget: "object"
                fields:
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Button URL", name: "url", widget: "string" }
              - label: "Second Call to Action"
                name: "cta2"
                widget: "object"
                required: false
                fields:
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Button URL", name: "url", widget: "string" }
          - { label: "Content", name: "body", widget: "markdown" }

      - name: "about"
        label: "About Page"
        file: "src/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - {
              label: "Layout",
              name: "layout",
              widget: "hidden",
              default: "page",
            }
          - { label: "Content", name: "body", widget: "markdown" }

      - name: "services"
        label: "Services Page"
        file: "src/services.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "Subtitle",
              name: "subtitle",
              widget: "string",
              required: false,
            }
          - { label: "Description", name: "description", widget: "text" }
          - {
              label: "Layout",
              name: "layout",
              widget: "hidden",
              default: "page",
            }
          - { label: "Content", name: "body", widget: "markdown" }

      - name: "contact"
        label: "Contact Page"
        file: "src/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "Subtitle",
              name: "subtitle",
              widget: "string",
              required: false,
            }
          - { label: "Description", name: "description", widget: "text" }
          - {
              label: "Layout",
              name: "layout",
              widget: "hidden",
              default: "page",
            }
          - { label: "Content", name: "body", widget: "markdown" }
