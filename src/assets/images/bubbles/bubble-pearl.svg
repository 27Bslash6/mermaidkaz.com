<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Pearl soap bubble, modeled on the LAB-504 stock set (41350.eps, macrovector):
       pearly white body with a soft outer glow, faint pink/aqua rim. -->
  <defs>
    <radialGradient id="glow">
      <stop offset="70%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="70%" stop-color="#f2eef4" stop-opacity=".1"/>
      <stop offset="92%" stop-color="#efe6ee" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".5"/>
    </radialGradient>
    <radialGradient id="pink">
      <stop offset="0%" stop-color="#e0b4c8" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#e0b4c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aqua">
      <stop offset="0%" stop-color="#8ab8b4" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#8ab8b4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rim"><circle cx="60" cy="60" r="52"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#glow)"/>
  <circle cx="60" cy="60" r="52" fill="url(#body)"/>
  <g clip-path="url(#rim)" filter="url(#soft)">
    <circle cx="34" cy="98" r="24" fill="url(#pink)"/>
    <circle cx="96" cy="82" r="24" fill="url(#aqua)"/>
    <circle cx="82" cy="20" r="22" fill="url(#pink)"/>
  </g>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.4"/>
  <ellipse cx="40" cy="32" rx="15" ry="10" transform="rotate(-36 40 32)" fill="#ffffff" opacity=".9"/>
  <circle cx="82" cy="90" r="5" fill="#ffffff" opacity=".55"/>
</svg>
